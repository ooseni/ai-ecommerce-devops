# The shape of the API's Secret. Do not apply this file as it is or put a real value
# in git: create the Secret with kubectl, as shown in k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: shop-raw
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_THE_OUTPUT_OF_openssl_rand_hex_32
