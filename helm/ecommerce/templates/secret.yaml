# Generated on first install and kept on upgrades, so no secret lives in git or values.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "shop-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  JWT_SECRET: {{ index $existing.data "JWT_SECRET" }}
  ADMIN_PASSWORD: {{ index $existing.data "ADMIN_PASSWORD" }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc }}
  ADMIN_PASSWORD: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
