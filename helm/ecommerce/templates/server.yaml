# Named "server" because docker/nginx.conf proxies to http://server:3000.
apiVersion: v1
kind: Service
metadata:
  name: server
  labels:
    app: server
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  selector:
    app: server
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
        mongo-client: "true"
        {{- include "ecommerce.labels" . | nindent 8 }}
      # A changed ConfigMap reaches a pod only when it restarts, so its hash rolls the pods.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # The API's first connection to MongoDB is never retried, so wait for the
      # database first, as depends_on does in Compose.
      initContainers:
        - name: wait-for-mongo
          image: {{ .Values.server.image }}:{{ include "ecommerce.tag" . }}
          command: ["sh", "-c", "until nc -z -w 2 mongo 27017; do echo waiting for mongo; sleep 2; done"]
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- include "ecommerce.containerSecurity" . | nindent 12 }}
      containers:
        - name: server
          image: {{ .Values.server.image }}:{{ include "ecommerce.tag" . }}
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          # Readiness includes the database: no traffic to a pod that cannot serve it.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness leaves the database out: a restart would not fix a database outage.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
          # Keep serving until the Service has stopped sending this pod new requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- include "ecommerce.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
