apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
# Elasticsearch runs without login inside the cluster, so only this namespace may reach it.
# Kibana is reached through kubectl port-forward and is never published.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logging-only
  namespace: logging
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
