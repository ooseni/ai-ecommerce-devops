# Marks each log line as error or info, then stores it by day.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: logging
data:
  pipeline.conf: |
    input {
      beats {
        port => 5044
      }
    }
    filter {
      if [message] =~ /(?i)error|exception|fail|refused|unavailable|disconnected/ {
        mutate { add_field => { "level" => "error" } }
      } else {
        mutate { add_field => { "level" => "info" } }
      }
    }
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "shop-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
spec:
  selector:
    app: logstash
  ports:
    - port: 5044
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.19.5
          args: ["-f", "/pipeline/pipeline.conf"]
          env:
            - name: LS_JAVA_OPTS
              value: -Xms256m -Xmx256m
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          ports:
            - containerPort: 5044
          readinessProbe:
            tcpSocket:
              port: 5044
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: pipeline
              mountPath: /pipeline
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
