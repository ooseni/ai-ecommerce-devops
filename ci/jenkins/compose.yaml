# Jenkins for the CI pipeline, kept apart from the shop's own stack.
# Start it from the repo root:
#   export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
#   docker compose -f ci/jenkins/compose.yaml up -d --build
name: jenkins

services:
  jenkins:
    build: .
    image: mern-shop-jenkins:local
    container_name: jenkins
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JAVA_OPTS: -Xmx1g
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"
    mem_limit: 2g
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins-home:
