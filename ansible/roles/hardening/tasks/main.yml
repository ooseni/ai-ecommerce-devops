- name: Install the firewall and fail2ban
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
    state: present

- name: Turn off SSH passwords and root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Ban repeated SSH failures
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# Allow SSH before enabling the firewall, or the connection running this play is cut.
- name: Allow the ports the node serves
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "6443"

# k3s needs its pod and service networks open. These ranges are its defaults.
- name: Allow the k3s pod and service networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop:
    - 10.42.0.0/16
    - 10.43.0.0/16

- name: Let the node forward traffic to its pods
  community.general.ufw:
    default: allow
    direction: routed

- name: Enable the firewall, denying everything else that comes in
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming
