- name: Wait for the instance to finish its first boot
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: base_packages
  retries: 5
  delay: 15
  until: base_packages is succeeded
