- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

# The public address goes in the API certificate, so kubectl can reach it from outside.
- name: Install k3s
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server --tls-san {{ inventory_hostname }} --write-kubeconfig-mode 600"

- name: Wait for the node to report Ready
  ansible.builtin.command: k3s kubectl get node --no-headers
  register: k3s_nodes
  changed_when: false
  retries: 30
  delay: 5
  until: k3s_nodes.rc == 0 and ' Ready ' in k3s_nodes.stdout

- name: Read the kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  no_log: true

- name: Create the local kube folder
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_dest | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save the kubeconfig locally, pointing at the public address
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' + inventory_hostname + ':6443') }}"
    dest: "{{ k3s_kubeconfig_dest }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
