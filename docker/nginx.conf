# Nginx serves the built shop and forwards API and Socket.IO traffic to the
# server container, so the browser only ever talks to one address.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # The support chat upgrades its HTTP connection to a WebSocket.
  location /socket.io/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # webpack puts a content hash in these file names, so they can be cached for a year.
  location ~* \.(?:js|css|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Every React route (/shop, /login, ...) loads index.html. It is never
  # cached, so a new release reaches users on their next visit.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
